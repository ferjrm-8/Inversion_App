    <meta name="description" content="Seguimiento mensual de inversiones por plataforma, control de capital acumulado y análisis integral de métricas de rendimiento." />
    <meta property="og:title" content="Gestor de Inversiones y Patrimonio" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById('root');
        if (el && (!window.__REACT_LOADED__)) {
          el.innerHTML = '<div style="padding:24px;color:#f87171;font-family:sans-serif;background:#020617;min-height:100vh;"><h3>Error al cargar:</h3><p>' + msg + '</p><p style="font-size:12px;color:#94a3b8;">' + url + ':' + line + '</p><button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#4f46e5;color:#fff;border:none;border-radius:8px;cursor:pointer;">Reintentar</button></div>';
        }
      };
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white" style="background-color: #020617; color: #f8fafc; margin: 0;">
    <div id="root">
      <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background-color:#020617;color:#94a3b8;font-family:sans-serif;font-size:14px;">
        <div style="text-align:center;">
          <div style="display:inline-block;width:32px;height:32px;border:3px solid #334155;border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite;"></div>
          <p style="margin-top:12px;font-weight:500;">Cargando Gestor de Inversiones...</p>
        </div>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
